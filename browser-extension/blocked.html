<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Akses Diblokir oleh ShieldGuard Firewall</title>
  <style>
    body {
      margin: 0; padding: 24px; min-height: 100vh;
      background: #0b0f19; color: #f9fafb;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    .card {
      max-width: 600px; width: 100%;
      background: #111827; border: 2px solid #ef4444;
      border-radius: 16px; padding: 36px; text-align: center;
      box-shadow: 0 25px 50px rgba(0,0,0,0.75);
    }
    .icon { font-size: 56px; margin-bottom: 12px; }
    h1 { color: #f87171; font-size: 24px; margin: 0 0 12px; }
    p { color: #d1d5db; font-size: 14px; line-height: 1.6; margin-bottom: 20px; }
    .info-box {
      background: #1f2937; border: 1px solid #374151;
      border-radius: 10px; padding: 16px; text-align: left;
      font-size: 13px; margin-bottom: 24px;
    }
    .info-box div { margin-bottom: 8px; }
    .info-box span.lbl { color: #9ca3af; font-weight: 600; }
    .info-box span.val { color: #fca5a5; font-weight: 700; word-break: break-all; }
    .btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    button {
      border: none; padding: 11px 18px; border-radius: 8px;
      font-size: 13px; font-weight: 700; cursor: pointer;
    }
    .btn-primary { background: #2563eb; color: #fff; }
    .btn-secondary { background: #10b981; color: #fff; }
    .btn-outline { background: transparent; color: #9ca3af; border: 1px solid #374151; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🛡️⛔</div>
    <h1>Koneksi Diblokir oleh ShieldGuard Firewall</h1>
    <p>
      Ekstensi Browser & PC Firewall Anda telah menghentikan koneksi ke situs ini karena teridentifikasi sebagai <b>situs penipuan (Scam Kripto / Phishing)</b> atau berada dalam daftar hitam Anda.
    </p>
    <div class="info-box">
      <div><span class="lbl">Domain Sasaran: </span><span id="blockedDomain" class="val">-</span></div>
      <div><span class="lbl">Alasan Pemblokiran: </span><span id="blockedReason" class="val">-</span></div>
    </div>
    <div class="btns">
      <button id="btnSafeBack" class="btn-primary">⬅️ Kembali ke Halaman Aman</button>
      <button id="btnOpenDashboard" class="btn-secondary">🖥️ Buka Dashboard PC Firewall</button>
      <button id="btnUnblock" class="btn-outline">Buka Blokir Domain Ini</button>
    </div>
  </div>
  <script src="blocked.js"></script>
</body>
</html>
